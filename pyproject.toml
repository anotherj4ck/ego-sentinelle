[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "powershell: lance powershell.exe (lent, Windows seulement) ; suite rapide : -m \"not powershell\"",
]

[tool.coverage.run]
source = ["ego", "sentinelle"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
